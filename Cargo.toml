[workspace]
resolver = "2"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.86"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
ciborium = "0.2"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha3 = "0.10"

id-check = { path = "crates/id-check" }
id-core = { path = "crates/id-core" }
id-eth = { path = "crates/id-eth" }
id-grants = { path = "crates/id-grants" }
id-keys = { path = "crates/id-keys" }
id-resource = { path = "crates/id-resource" }
id-testkit = { path = "crates/id-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

# Arithmetic that overflows stops instead of wrapping, in release builds too.
[profile.release]
overflow-checks = true
